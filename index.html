    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
<link rel="stylesheet" href="css/dc.css">

<body>
<div data-dc="Home" style="display:contents"></div>
<noscript><p style="padding:40px;font:16px sans-serif">Для работы сайта нужен включённый JavaScript.</p></noscript>
<script src="js/dc.js"></script>
<script src="js/dc-site.js"></script>
<script>
DC.define("Home",(function(){
class Component extends DCLogic {
  state = { ready: false, w: 1280, slide: 0, reviews: [], cur: 0, cnt: 0, hov: -1, toast: '', toastOn: false, sheet: 1, sheets: 3, mode: '2d' };
  bpRef = React.createRef(); k3Ref = React.createRef(); prevRef = React.createRef(); marqRef = React.createRef();
  reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  SLIDES = [
    { src: 'img/works/kuhni/kuhni-261-10b74b.webp', label: 'Кухни' },
    { src: 'img/works/tv-zony/tv-zony-001-4479ee.webp', label: 'ТВ-зоны' },
    { src: 'img/works/shkafy/shkafy-017-94616f.webp', label: 'Шкафы' },
  ];
  CAT_IMG = { kuhni: 'img/works/kuhni/kuhni-144-376436.webp', shkafy: 'img/works/shkafy/shkafy-017-94616f.webp', sanuzly: 'img/works/sanuzly/sanuzly-014-8acf25.webp', 'tv-zony': 'img/works/tv-zony/tv-zony-001-4479ee.webp', ofis: 'img/works/ofis/ofis-005-e30479.webp' };
  PICKS = [['a', 'kuhni', 'kuhni-144-376436'], ['b', 'shkafy', 'shkafy-031-508fd6'], ['c', 'sanuzly', 'sanuzly-014-8acf25'], ['d', 'tv-zony', 'tv-zony-001-4479ee'], ['e', 'ofis', 'ofis-005-e30479']];
  AREAS = { a: ['1 / 7', '1 / 3'], b: ['7 / 10', '1 / 3'], c: ['10 / 13', '1 / 3'], d: ['1 / 7', '3 / 5'], e: ['7 / 13', '3 / 5'] };

  R(u) { return (window.__resources && window.__resources[u]) || u; }
  boot() {
    return window.__asdBoot || (window.__asdBoot = ['js/config.js', 'js/works-data.js', 'js/api.js'].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = (window.__resources && window.__resources[src]) || src; s.onload = res; s.onerror = res; document.head.appendChild(s);
    })), Promise.resolve()));
  }
  loadScript(src) { return new Promise((res) => { const s = document.createElement('script'); s.src = this.R(src); s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
  plural(n, f) { const a = Math.abs(n) % 100, b = a % 10; return (a > 10 && a < 20) ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; }
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0'); }
  fmtNum(n) { return (Math.round(n * 10) / 10).toFixed(1).replace('.', ','); }
  fmtDate(iso) { try { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }
  stars(n, on, off) { return [1, 2, 3, 4, 5].map((i) => (i <= Math.round(n) ? on : off)); }

  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR); this.onR();
    this.heroIn();
    this.fx3d();
    this.reveal();
    if (!this.reduce) {
      this.slideT = setInterval(() => this.setState((s) => ({ slide: (s.slide + 1) % this.SLIDES.length })), 6500);
      document.querySelectorAll('[data-kb]').forEach((img, i) => img.animate([{ transform: 'scale(1.02)' }, { transform: 'scale(1.12)' }], { duration: 16000 + i * 2000, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }));
      if (this.marqRef.current) this.marq = this.marqRef.current.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-50%)' }], { duration: 60000, iterations: Infinity });
    }
    this.boot().then(() => {
      this.setState({ ready: true }, () => this.reveal());
      this.countUp(((window.WORKS || {}).items || []).length);
      if (window.Api) window.Api.listReviews().then((list) => this.setState({ reviews: list || [] }, () => { this.reveal(); this.showQ(0); })).catch(() => {});
    });
    this.loadScript('js/kitchens.js').then(() => this.bpInit());
    if (!this.reduce) this.loadScript('js/gl3d.js').then(() => this.loadScript('js/kitchen3d.js')).then(() => { if (window.ASDKitchen3D && this.k3Ref.current) this.k3d = window.ASDKitchen3D.mount(this.k3Ref.current); });
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onR); clearInterval(this.slideT); clearTimeout(this.qT); clearTimeout(this.toastT);
    (this.bpTimers || []).forEach(clearTimeout); if (this.io) this.io.disconnect(); if (this.bpIo) this.bpIo.disconnect();
  }

  fx3d() {
    if (this.reduce || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    const par = document.querySelector('[data-par]'), hero = par && par.parentNode;
    if (hero) {
      hero.addEventListener('pointermove', (e) => { const r = hero.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5; par.style.transform = 'perspective(1800px) rotateY(' + (x * 3) + 'deg) rotateX(' + (-y * 2.4) + 'deg) scale(1.05)'; });
      hero.addEventListener('pointerleave', () => { par.style.transform = ''; });
    }
    let cur = null;
    document.addEventListener('pointermove', (e) => {
      const el = e.target.closest && e.target.closest('[data-tilt]');
      if (cur && cur !== el) { cur.style.transform = ''; cur.style.boxShadow = ''; cur = null; }
      if (!el) return; cur = el;
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = 'perspective(1100px) rotateY(' + (x * 7) + 'deg) rotateX(' + (-y * 7) + 'deg) translateZ(0)';
      el.style.boxShadow = '0 40px 70px -40px rgba(20,18,15,.55)';
    }, { passive: true });
  }
  heroIn() {
    if (this.reduce) return;
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    document.querySelectorAll('[data-line]').forEach((el) => el.animate([{ transform: 'translateY(110%)' }, { transform: 'none' }], { duration: 1400, delay: 150 + (+el.dataset.line) * 130, easing: ease, fill: 'both' }));
    document.querySelectorAll('[data-hero-fade]').forEach((el) => el.animate([{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], { duration: 1200, delay: 600 + (+el.dataset.heroFade) * 150, easing: ease, fill: 'both' }));
  }
  reveal() {
    if (this.reduce || !('IntersectionObserver' in window)) return;
    if (!this.io) {
      this.anims = new WeakMap();
      this.io = new IntersectionObserver((es) => es.forEach((en) => {
        if (!en.isIntersecting) return;
        (this.anims.get(en.target) || []).forEach((a) => a.play());
        this.io.unobserve(en.target);
      }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    }
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    const add = (el, kf, opt) => {
      if (this.anims.has(el)) return;
      const a = el.animate(kf, Object.assign({ easing: ease, fill: 'both' }, opt)); a.pause();
      this.anims.set(el, [a]); this.io.observe(el);
    };
    document.querySelectorAll('[data-reveal]').forEach((el) => add(el, [{ opacity: 0, transform: 'translateY(36px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: (+el.dataset.reveal || 0) * 90 }));
    document.querySelectorAll('[data-grow]').forEach((el) => add(el, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 1400, delay: (+el.dataset.grow) * 160 }));
    document.querySelectorAll('[data-draw]').forEach((el) => add(el, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1800, delay: 400 + (+el.dataset.draw) * 160 }));
  }
  countUp(to) {
    if (this.reduce || !to) { this.setState({ cnt: to }); return; }
    const t0 = performance.now(), dur = 1800;
    const tick = (t) => { const p = Math.min(1, (t - t0) / dur); this.setState({ cnt: Math.round(to * (1 - Math.pow(1 - p, 3))) }); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }

  showQ(n) {
    const len = Math.min(5, this.state.reviews.length); if (!len) return;
    this.setState({ cur: (n + len) % len });
    clearTimeout(this.qT);
    if (!this.reduce && len > 1 && !this.qPaused) this.qT = setTimeout(() => this.showQ(this.state.cur + 1), 7000);
  }

  bpInit() {
    const svg = this.bpRef.current, list = window.KITCHENS || [];
    if (!svg || !list.length) return;
    this.bpTimers = []; this.bpIdx = -1; this.bpVisible = false; this.setState({ sheets: list.length });
    if (this.reduce) { this.bpLoad(0); this.bpStatic(); return; }
    this.bpIo = new IntersectionObserver((e) => { this.bpVisible = e[0].isIntersecting; if (this.bpVisible && this.bpIdx < 0) this.bpDraw(); }, { threshold: 0.3 });
    this.bpIo.observe(svg);
  }
  bpLoad(i) {
    const svg = this.bpRef.current, list = window.KITCHENS;
    svg.innerHTML = list[i % list.length];
    const scan = svg.querySelector('.scan'); if (scan) scan.remove();
    svg.querySelectorAll('.ln').forEach((p) => {
      const thin = p.classList.contains('thin'), dim = p.classList.contains('dim');
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor'); p.setAttribute('stroke-width', thin || dim ? '1' : '1.4');
      p.setAttribute('vector-effect', 'non-scaling-stroke'); p.setAttribute('stroke-linecap', 'square'); p.setAttribute('stroke-dasharray', '1');
      if (thin) p.setAttribute('opacity', '.7'); if (dim) p.setAttribute('opacity', '.55');
    });
    const OP = { 'f-cab': 0.07, 'f-top': 0.5, 'f-app': 0.16, 'f-sink': 0.22 };
    svg.querySelectorAll('.fill').forEach((f) => { f.setAttribute('fill', 'currentColor'); const k = Object.keys(OP).find((c) => f.classList.contains(c)); f.dataset.o = OP[k] || 0.1; f.setAttribute('opacity', f.dataset.o); });
    svg.querySelectorAll('text').forEach((t) => {
      const tag = t.classList.contains('tag');
      t.setAttribute('fill', tag ? '#A79E93' : '#EAD6B4');
      t.style.font = (tag ? '600 11px' : '500 13px') + ' Manrope, sans-serif'; t.style.letterSpacing = tag ? '.16em' : '.08em'; if (tag) t.style.textTransform = 'uppercase';
    });
    this.setState({ sheet: (i % list.length) + 1 });
  }
  bpStatic() { this.bpRef.current.querySelectorAll('.cnt').forEach((el) => { el.textContent = this.fmt(+el.dataset.val); }); }
  bpDraw() {
    const svg = this.bpRef.current; if (!svg) return;
    this.bpIdx++; this.bpLoad(this.bpIdx);
    const k = 0.75, D = (el) => parseFloat(el.style.getPropertyValue('--d')) || 0;
    svg.style.opacity = 1;
    svg.querySelectorAll('.ln').forEach((p) => { const t = parseFloat(p.style.getPropertyValue('--t')) || 1; p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: t * 1000 * k, delay: D(p) * 1000 * k, easing: 'cubic-bezier(.55,.1,.25,1)', fill: 'both' }); });
    svg.querySelectorAll('.fill').forEach((f) => f.animate([{ opacity: 0 }, { opacity: f.dataset.o }], { duration: 900, delay: D(f) * 1000 * k, fill: 'both' }));
    svg.querySelectorAll('text').forEach((t) => t.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, delay: D(t) * 1000 * k, fill: 'both' }));
    svg.querySelectorAll('.cnt').forEach((el) => {
      const v = +el.dataset.val, t0 = performance.now() + D(el) * 1000 * k; el.textContent = '0';
      const tick = (now) => { const p = Math.min(1, Math.max(0, (now - t0) / 1100)); el.textContent = this.fmt(Math.round(v * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    });
    this.bpTimers.push(setTimeout(() => this.to3d(), 7.2 * 1000 * k + 1800));
  }
  to3d() {
    if (!this.k3d || !this.bpVisible || document.hidden) { this.bpTimers.push(setTimeout(() => (this.k3d ? this.to3d() : this.bpNext()), this.k3d ? 1000 : 3200)); return; }
    this.setState({ mode: '3d' });
    this.k3d.play(this.bpIdx, () => { this.setState({ mode: '2d' }); this.k3d.stop(); this.bpNext(); });
  }
  bpNext() {
    if (!this.bpVisible || document.hidden) { this.bpTimers.push(setTimeout(() => this.bpNext(), 1000)); return; }
    const svg = this.bpRef.current; if (!svg) return;
    svg.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(4px)' }], { duration: 700, fill: 'forwards' }).onfinish = () => { svg.getAnimations().forEach((a) => a.cancel()); this.bpDraw(); };
  }

  copy(page) {
    const url = new URL(page, location.href).href;
    const done = () => { this.setState({ toast: 'Ссылка скопирована', toastOn: true }); clearTimeout(this.toastT); this.toastT = setTimeout(() => this.setState({ toastOn: false }), 2200); };
    if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)) { navigator.share({ url, title: 'ASD' }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(done).catch(() => {
      const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {} ta.remove(); done();
    });
  }

  renderVals() {
    const W = window.WORKS || { categories: [], items: [] };
    const counts = {}; (W.items || []).forEach((i) => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
    const photos = (n) => n + ' фото';
    const wide = this.state.w > 900, desk = this.state.w > 900;
    const slide = this.state.slide;

    const slides = this.SLIDES.map((s, i) => ({
      src: this.R(s.src), op: i === slide ? 1 : 0, aria: 'Слайд ' + (i + 1),
      fill: i < slide ? 1 : i === slide ? 1 : 0, tr: i === slide && !this.reduce ? 'transform 6.5s linear' : 'none',
      go: () => { this.setState({ slide: i }); clearInterval(this.slideT); if (!this.reduce) this.slideT = setInterval(() => this.setState((st) => ({ slide: (st.slide + 1) % this.SLIDES.length })), 6500); },
    }));
    const tiles = this.PICKS.map(([k, cat, file], i) => {
      const item = (W.items || []).find((x) => x.full.indexOf(file) !== -1);
      const c = (W.categories || []).find((x) => x.id === cat) || { title: '' };
      const big = k === 'a';
      return {
        href: 'works.html?c=' + cat, src: this.R(item ? item.full : 'img/works/' + cat + '/' + file + '.webp'), alt: c.title + ' на заказ — работа ASD',
        title: c.title.replace(/-/g, '\u2011'), n: counts[cat] ? photos(counts[cat]) : '', aria: 'Раздел «' + c.title + '»', ri: i % 4,
        col: desk ? this.AREAS[k][0] : (big ? '1 / -1' : 'auto'), row: desk ? this.AREAS[k][1] : 'auto', ar: desk ? 'auto' : (big ? '4 / 3' : '3 / 4'),
      };
    });
    const hov = this.state.hov;
    const cats = (W.categories || []).map((c, i) => ({
      href: 'works.html?c=' + c.id, idx: '0' + (i + 1), title: c.title.replace(/-/g, '\u2011'), text: c.text, n: counts[c.id] ? photos(counts[c.id]) : 'скоро',
      img: this.R(this.CAT_IMG[c.id]), ri: i, op: wide && hov >= 0 && hov !== i ? 0.35 : 1,
      enter: () => this.setState({ hov: i }),
      arrowBd: hov === i ? '#E2C7A2' : 'rgba(251,250,247,.3)', arrowBg: hov === i ? '#E2C7A2' : 'transparent', arrowFg: hov === i ? '#14120F' : '#FBFAF7', arrowTf: hov === i ? 'rotate(-45deg)' : 'none',
      pop: hov === i ? 1 : 0, pscale: hov === i ? 1 : 1.12,
    }));

    const all = this.state.reviews || [];
    const real = all.filter((r) => !r.sample);
    let proof = false;
    if (real.length) {
      const avg = real.reduce((s, r) => s + r.rating, 0) / real.length;
      proof = { avg: this.fmtNum(avg), label: 'по ' + real.length + ' ' + this.plural(real.length, ['отзыву', 'отзывам', 'отзывам']), stars: this.stars(avg, '#E2C7A2', 'rgba(251,250,247,.3)'), aria: 'Оценка ' + this.fmtNum(avg) + ' из 5' };
    }
    const base = real.length ? real : all;
    const avgB = base.length ? base.reduce((s, r) => s + r.rating, 0) / base.length : 0;
    const top = all.slice(0, 5), cur = this.state.cur;
    const quotes = top.map((r, i) => ({
      body: r.body.length > 260 ? r.body.slice(0, 257).trim() + '…' : r.body, name: r.name, initial: (r.name || '?').trim().charAt(0).toUpperCase(),
      meta: this.fmtDate(r.created_at) + (r.sample ? ' · пример отзыва' : ''), stars: this.stars(r.rating, '#E2C7A2', 'rgba(251,250,247,.25)'), aria: 'Оценка ' + r.rating + ' из 5',
      op: i === cur ? 1 : 0, ty: i === cur ? '0px' : '18px', pe: i === cur ? 'auto' : 'none', hidden: i === cur ? 'false' : 'true',
      tr: i === cur ? 'opacity .9s cubic-bezier(.2,.8,.2,1) .25s, transform .9s cubic-bezier(.2,.8,.2,1) .25s' : 'opacity .3s ease, transform .3s ease',
      fill: i <= cur ? 1 : 0, ftr: i === cur && !this.reduce ? 'transform 7s linear' : 'none', dotLabel: 'Отзыв ' + (i + 1), go: () => this.showQ(i),
    }));
    const marqWords = (W.categories || []).map((c) => c.title).concat(['Под ваши размеры', 'Дизайн-проект']);

    return {
      slides, slideNo: String(slide + 1).padStart(2, '0') + ' / ' + String(this.SLIDES.length).padStart(2, '0'), slideLabel: this.SLIDES[slide].label,
      cntStr: this.fmt(this.state.cnt), proof,
      marqRef: this.marqRef, marqGroups: [0, 1], marqWords: marqWords.length > 2 ? marqWords : ['Кухни', 'Шкафы', 'Санузлы', 'ТВ-зоны', 'Офисная мебель', 'Под ваши размеры', 'Дизайн-проект'],
      marqPause: () => this.marq && this.marq.pause(), marqPlay: () => this.marq && this.marq.play(),
      mosaicCols: desk ? 'repeat(12, minmax(0,1fr))' : 'repeat(2, minmax(0,1fr))', mosaicRows: desk ? 'clamp(120px, 13vw, 200px)' : 'auto', tiles,
      copyWorks: () => this.copy('works.html'), copyReviews: () => this.copy('reviews.html'),
      cats, wide, narrow: !wide, catCols: wide ? '64px minmax(0,1.3fr) minmax(0,1fr) auto 52px' : '36px minmax(0,1fr) 64px 52px',
      prevRef: this.prevRef, prevOp: hov >= 0 ? 1 : 0, prevScale: hov >= 0 ? 1 : 0.86, prevRot: hov >= 0 ? '-2deg' : '0deg',
      onCatMove: (e) => { const el = this.prevRef.current; if (el) el.style.transform = 'translate3d(' + (e.clientX + 32) + 'px,' + (e.clientY - 190) + 'px,0)'; },
      onCatLeave: () => this.setState({ hov: -1 }),
      hasReviews: top.length > 0,
      score: { avg: this.fmtNum(avgB), stars: this.stars(avgB, '#E2C7A2', 'rgba(251,250,247,.25)'), aria: 'Оценка ' + this.fmtNum(avgB) + ' из 5', label: 'средняя оценка по ' + base.length + ' ' + this.plural(base.length, ['отзыву', 'отзывам', 'отзывам']) },
      quotes, multiQuotes: top.length > 1,
