<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Наши работы — ASD</title>
  <meta name="description" content="Фото наших работ: кухни, шкафы, санузлы, ТВ-зоны и офисная мебель на заказ."></meta>
  <meta name="theme-color" content="#F4F1EC"></meta>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml"></link>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""></link>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"></link>
  <style>
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #F4F1EC; color: #1A1714; font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    a { color: inherit; } a:hover { color: #8C6239; }
    ::selection { background: #C9A074; color: #14120F; }
    :focus-visible { outline: 2px solid #B98D5E; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</helmet>

<dc-import name="SiteHeader" active="works" tone="light" hint-size="100%,0px"></dc-import>

<main>
  <section data-screen-label="Works hero" style="padding:calc(84px + clamp(48px,7vw,104px)) 0 clamp(28px,3vw,44px)">
    <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px 48px">
      <div data-in="0" style="max-width:820px">
        <div style="display:flex;align-items:center;gap:14px;font:600 11.5px/1 Manrope, sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8C6239;margin-bottom:24px"><span style="width:36px;height:1px;background:currentColor"></span>Портфолио</div>
        <h1 style="margin:0;font:300 clamp(3rem,7vw,6.6rem)/.98 'Noto Serif Display', serif;letter-spacing:-.035em">Наши работы<sc-if value="{{ catTitle }}" hint-placeholder-val="{{ false }}"><span style="color:#B5ACA1"> · </span><em style="font-style:italic;color:#8C6239">{{ catTitle }}</em></sc-if></h1>
        <p style="margin:24px 0 0;max-width:48ch;color:#6B635A;font:400 17px/1.7 Manrope, sans-serif;text-wrap:pretty">{{ catText }}</p>
      </div>
      <button data-in="1" type="button" onClick="{{ share }}" style="display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px;border-radius:999px;border:1px solid rgba(26,23,20,.25);background:transparent;color:#1A1714;font:600 14px Manrope, sans-serif;cursor:pointer;transition:border-color .3s, background-color .3s" style-hover="border-color:#1A1714;background:#FBFAF7">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
        Скопировать ссылку на раздел
      </button>
    </div>
  </section>

  <section style="padding:0 0 clamp(80px,10vw,140px)">
    <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px)">
      <div style="position:sticky;top:68px;z-index:20;margin:0 calc(-1 * clamp(20px,4vw,56px));padding:14px clamp(20px,4vw,56px);background:rgba(244,241,236,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #E2DCD3">
        <div role="group" aria-label="Разделы" style="display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="6">
            <button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="flex:none;display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;border-radius:999px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};font:600 14px Manrope, sans-serif;cursor:pointer;transition:background-color .3s, color .3s, border-color .3s" style-hover="border-color:#1A1714">
              {{ c.label }}<span style="font:500 12px Manrope, sans-serif;opacity:.6;font-variant-numeric:tabular-nums">{{ c.n }}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{ hasSubs }}" hint-placeholder-val="{{ false }}">
          <div role="group" aria-label="Подразделы" style="display:flex;gap:22px;overflow-x:auto;padding:12px 2px 0">
            <sc-for list="{{ subs }}" as="s">
              <button type="button" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}" style="flex:none;height:32px;padding:0;border:0;border-bottom:1px solid {{ s.bd }};background:transparent;color:{{ s.fg }};font:500 14px Manrope, sans-serif;cursor:pointer">{{ s.label }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <p aria-live="polite" style="margin:28px 0 22px;color:#6B635A;font:500 13px Manrope, sans-serif;letter-spacing:.14em;text-transform:uppercase">{{ countLabel }}</p>

      <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
        <div ref="{{ gridRef }}" style="column-count:{{ cols }};column-gap:clamp(10px,1.2vw,18px)">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="0">
            <button type="button" data-tile="{{ it.i }}" onClick="{{ it.open }}" aria-label="{{ it.aria }}" style="display:block;width:100%;margin:0 0 clamp(10px,1.2vw,18px);padding:0;border:0;border-radius:6px;overflow:hidden;background:#E2DCD3;cursor:zoom-in;break-inside:avoid;position:relative;aspect-ratio:{{ it.ar }}">
              <img src="{{ it.src }}" alt="{{ it.alt }}" loading="lazy" decoding="async" style="display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1), filter .6s" style-hover="transform:scale(1.045);filter:brightness(1.04)"></img>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:clamp(56px,9vw,120px) 20px;border:1px solid #E2DCD3;border-radius:20px;background:#FBFAF7">
          <div style="width:64px;height:64px;border-radius:999px;background:#EFE6DA;display:grid;place-items:center;color:#8C6239">
            <svg width="28" height="28" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="16" width="52" height="38"></rect><circle cx="32" cy="35" r="10"></circle><path d="M22 16l4-8h12l4 8"></path></svg>
          </div>
          <h3 style="margin:0;font:300 32px/1.1 'Noto Serif Display', serif">Фото появятся здесь</h3>
          <p style="margin:0;max-width:42ch;color:#6B635A;font:400 15.5px/1.6 Manrope, sans-serif">Мы готовим подборку этого раздела. Загляните чуть позже — или посмотрите другие работы.</p>
        </div>
      </sc-if>
    </div>
  </section>
</main>

<dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>

<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="Просмотр фото" onClick="{{ lbBackdrop }}" onTouchStart="{{ tStart }}" onTouchEnd="{{ tEnd }}" style="position:fixed;inset:0;z-index:300;background:rgba(14,12,10,.96);display:flex;align-items:center;justify-content:center;color:#FBFAF7">
    <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,3vw,32px);pointer-events:none">
      <span style="font:600 11px Manrope, sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#C9A074">{{ lbCat }}</span>
      <span style="font:500 13px Manrope, sans-serif;color:#B5ACA1;font-variant-numeric:tabular-nums">{{ lbCount }}</span>
    </div>
    <img ref="{{ lbImgRef }}" data-lb="" src="{{ lbSrc }}" alt="{{ lbAlt }}" style="max-width:min(92vw,1500px);max-height:84vh;object-fit:contain;user-select:none;border-radius:4px;box-shadow:0 40px 100px -30px rgba(0,0,0,.8)"></img>
    <button type="button" ref="{{ lbCloseRef }}" data-lbbtn="" onClick="{{ lbClose }}" aria-label="Закрыть" style="position:absolute;top:56px;right:clamp(16px,3vw,32px);width:52px;height:52px;border-radius:999px;border:1px solid rgba(251,250,247,.3);background:rgba(20,18,15,.4);color:#FBFAF7;cursor:pointer;display:grid;place-items:center;transition:background-color .3s, color .3s" style-hover="background:#FBFAF7;color:#14120F">
      <svg width="14" height="14" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.4"><path d="M1 1l10 10M11 1L1 11"></path></svg>
    </button>
    <sc-if value="{{ lbMulti }}" hint-placeholder-val="{{ true }}">
      <button type="button" data-lbbtn="" onClick="{{ lbPrev }}" aria-label="Предыдущее фото" style="position:absolute;left:clamp(12px,3vw,32px);top:{{ navTop }};bottom:{{ navBottom }};margin:auto 0;width:56px;height:56px;border-radius:999px;border:1px solid rgba(251,250,247,.3);background:rgba(20,18,15,.4);color:#FBFAF7;cursor:pointer;display:grid;place-items:center;transition:background-color .3s, color .3s" style-hover="background:#FBFAF7;color:#14120F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12H4M10 6l-6 6 6 6"></path></svg>
      </button>
      <button type="button" data-lbbtn="" onClick="{{ lbNext }}" aria-label="Следующее фото" style="position:absolute;right:clamp(12px,3vw,32px);top:{{ navTop }};bottom:{{ navBottom }};margin:auto 0;width:56px;height:56px;border-radius:999px;border:1px solid rgba(251,250,247,.3);background:rgba(20,18,15,.4);color:#FBFAF7;cursor:pointer;display:grid;place-items:center;transition:background-color .3s, color .3s" style-hover="background:#FBFAF7;color:#14120F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16M14 6l6 6-6 6"></path></svg>
      </button>
    </sc-if>
  </div>
</sc-if>

<div role="status" aria-live="polite" style="position:fixed;left:50%;bottom:28px;z-index:350;transform:translateX(-50%) translateY({{ toastY }});opacity:{{ toastOp }};transition:opacity .35s, transform .5s cubic-bezier(.2,.8,.2,1);background:#1A1714;color:#FBFAF7;padding:14px 22px;border-radius:999px;font:500 14px Manrope, sans-serif;box-shadow:0 20px 40px -16px rgba(0,0,0,.5);pointer-events:none;display:flex;align-items:center;gap:10px">
  <span style="width:6px;height:6px;border-radius:999px;background:#C9A074"></span>Ссылка скопирована
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, w: 1280, cat: 'all', sub: 'all', lb: -1, toastOn: false };
  gridRef = React.createRef(); lbImgRef = React.createRef(); lbCloseRef = React.createRef();
  reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Превью-проект содержит только часть фотографий. На сайте уберите этот фильтр — будут показаны все работы из works-data.js.
  PREVIEW_FILES = ['kuhni-121', 'kuhni-144', 'kuhni-125', 'kuhni-001', 'kuhni-002', 'kuhni-003', 'kuhni-010', 'kuhni-020', 'kuhni-050', 'kuhni-080',
    'shkafy-017', 'shkafy-031', 'shkafy-005', 'shkafy-010', 'shkafy-040', 'shkafy-060', 'sanuzly-014', 'sanuzly-001', 'sanuzly-003', 'sanuzly-008', 'sanuzly-020',
    'tv-zony-004', 'tv-zony-001', 'tv-zony-002', 'tv-zony-003', 'tv-zony-006', 'ofis-001', 'ofis-005', 'ofis-010', 'ofis-020', 'ofis-030'];

  boot() {
    return window.__asdBoot || (window.__asdBoot = ['js/config.js', 'js/works-data.js', 'js/api.js'].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s);
    })), Promise.resolve()));
  }
  all() {
    const W = window.WORKS || { items: [] };
    const set = this.PREVIEW_FILES;
    return (W.items || []).filter((i) => !set || set.some((f) => i.full.indexOf('/' + f + '-') !== -1));
  }
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR); this.onR();
    this.onKey = (e) => {
      if (this.state.lb < 0) return;
      if (e.key === 'Escape') this.close(); else if (e.key === 'ArrowLeft') this.step(-1); else if (e.key === 'ArrowRight') this.step(1);
    };
    document.addEventListener('keydown', this.onKey);
    if (!this.reduce) document.querySelectorAll('[data-in]').forEach((el) => el.animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: 100 + (+el.dataset.in) * 120, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'both' }));
    this.boot().then(() => {
      const W = window.WORKS || { categories: [] };
      const c = new URLSearchParams(location.search).get('c');
      this.setState({ ready: true, cat: (W.categories || []).some((x) => x.id === c) ? c : 'all' }, () => this.animateGrid());
    });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); document.removeEventListener('keydown', this.onKey); document.documentElement.style.overflow = ''; }

  animateGrid() {
    if (this.reduce) return;
    requestAnimationFrame(() => {
      const tiles = document.querySelectorAll('[data-tile]');
      let k = 0;
      tiles.forEach((el) => {
        const r = el.getBoundingClientRect();
        if (r.top > window.innerHeight + 200) return;
        el.animate([{ opacity: 0, transform: 'translateY(28px) scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: Math.min(k++, 12) * 60, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
      });
    });
  }
  setCat(cat) {
    this.setState({ cat, sub: 'all' }, () => {
      const u = new URL(location.href); if (cat === 'all') u.searchParams.delete('c'); else u.searchParams.set('c', cat);
      try { history.replaceState(null, '', u); } catch (e) {}
      this.animateGrid();
    });
  }
  view() {
    const { cat, sub } = this.state;
    return this.all().filter((i) => (cat === 'all' || i.cat === cat) && (sub === 'all' || i.sub === sub));
  }
  open(i) {
    this.lastFocus = document.activeElement; document.documentElement.style.overflow = 'hidden';
    this.setState({ lb: i }, () => { this.lbCloseRef.current && this.lbCloseRef.current.focus({ preventScroll: true }); this.fadeImg(); this.preload(); });
  }
  close() { this.setState({ lb: -1 }); document.documentElement.style.overflow = ''; if (this.lastFocus) this.lastFocus.focus({ preventScroll: true }); }
  step(d) { const n = this.view().length; if (!n) return; this.setState((s) => ({ lb: (s.lb + d + n) % n }), () => { this.fadeImg(d); this.preload(); }); }
  fadeImg(d) {
    const img = this.lbImgRef.current; if (!img || this.reduce) return;
    img.animate([{ opacity: 0, transform: 'translateX(' + ((d || 0) * 24) + 'px) scale(' + (d ? 1 : 0.97) + ')' }, { opacity: 1, transform: 'none' }], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
  preload() { const v = this.view(), i = this.state.lb; [v[i + 1], v[i - 1]].forEach((n) => { if (n) new Image().src = n.full; }); }
  share() {
    const page = this.state.cat === 'all' ? 'Works.dc.html' : 'Works.dc.html?c=' + this.state.cat;
    const url = new URL(page, location.href).href;
    const done = () => { this.setState({ toastOn: true }); clearTimeout(this.tT); this.tT = setTimeout(() => this.setState({ toastOn: false }), 2200); };
    if (navigator.share && /Android|iPhone|iPad/i.test(navigator.userAgent)) { navigator.share({ url, title: 'ASD' }).catch(() => {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(done).catch(() => {
      const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {} ta.remove(); done();
    });
  }

  renderVals() {
    const W = window.WORKS || { categories: [], items: [] };
    const all = this.all();
    const counts = {}; all.forEach((i) => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
    const { cat, sub, lb, w } = this.state;
    const c = (W.categories || []).find((x) => x.id === cat);
    const chipsSrc = [['all', 'Все работы', all.length]].concat((W.categories || []).map((x) => [x.id, x.title, counts[x.id] || 0]));
    const chips = chipsSrc.map(([id, t, n]) => {
      const on = id === cat;
      return { label: t, n, on: String(on), pick: () => this.setCat(id), bg: on ? '#1A1714' : 'transparent', fg: on ? '#FBFAF7' : '#1A1714', bd: on ? '#1A1714' : 'rgba(26,23,20,.18)' };
    });
    const subList = cat === 'all' ? [] : [...new Set(all.filter((i) => i.cat === cat && i.sub).map((i) => i.sub))];
    const subs = subList.length ? [['all', 'Все']].concat(subList.map((s) => [s, s])).map(([id, t]) => {
      const on = id === sub;
      return { label: t, on: String(on), pick: () => this.setState({ sub: id }, () => this.animateGrid()), fg: on ? '#1A1714' : '#6B635A', bd: on ? '#B98D5E' : 'transparent' };
    }) : [];
    const view = this.view();
    const catName = (id) => ((W.categories || []).find((x) => x.id === id) || {}).title || 'Работа';
    const items = view.map((it, i) => ({
      i, src: it.full, alt: catName(it.cat), aria: 'Открыть фото ' + (i + 1), ar: (it.w || 4) + ' / ' + (it.h || 3), open: () => this.open(i),
    }));
    const cur = view[lb];
    const narrow = w < 640;
    return {
      catTitle: c ? c.title : false, catText: c ? c.text : 'Фотографии готовых проектов. Выберите раздел.',
      share: () => this.share(), chips, subs, hasSubs: subs.length > 0,
      countLabel: this.state.ready ? (view.length ? view.length + ' фото' : '') : '',
      hasItems: !this.state.ready || view.length > 0, empty: this.state.ready && !view.length,
      items, gridRef: this.gridRef, cols: w > 1100 ? 3 : w > 560 ? 2 : 2,
      lbOpen: lb >= 0 && !!cur, lbSrc: cur ? cur.full : '', lbAlt: cur ? catName(cur.cat) : '', lbCat: cur ? catName(cur.cat) : '',
      lbCount: cur ? (lb + 1) + ' из ' + view.length : '', lbMulti: view.length > 1, lbImgRef: this.lbImgRef, lbCloseRef: this.lbCloseRef,
      navTop: narrow ? 'auto' : '0', navBottom: narrow ? '20px' : '0',
      lbClose: () => this.close(), lbPrev: (e) => { e.stopPropagation(); this.step(-1); }, lbNext: (e) => { e.stopPropagation(); this.step(1); },
      lbBackdrop: (e) => { if (e.target === e.currentTarget) this.close(); },
      tStart: (e) => { this.sx = e.touches[0].clientX; }, tEnd: (e) => { if (this.sx == null) return; const dx = e.changedTouches[0].clientX - this.sx; if (Math.abs(dx) > 50) this.step(dx < 0 ? 1 : -1); this.sx = null; },
      toastOp: this.state.toastOn ? 1 : 0, toastY: this.state.toastOn ? '0px' : '20px',
    };
  }
}
</script>
</body>
</html>
