<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:60;background:{{ bg }};border-bottom:1px solid {{ border }};backdrop-filter:{{ blur }};-webkit-backdrop-filter:{{ blur }};transition:background-color .5s ease, border-color .5s ease">
  <div style="max-width:1440px;margin:0 auto;padding:0 clamp(20px,4vw,56px);height:{{ h }};display:flex;align-items:center;gap:28px;transition:height .45s cubic-bezier(.2,.8,.2,1)">
    <a href="Home.dc.html" aria-label="ASD — на главную" style="display:flex;align-items:center;line-height:0;flex:none">
      <img src="{{ logo }}" alt="ASD" width="122" height="45" style="height:40px;width:auto;display:block"></img>
    </a>
    <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Основное меню" style="display:flex;align-items:center;gap:clamp(20px,2.6vw,40px);margin-left:auto">
        <a href="Works.dc.html" aria-current="{{ curWorks }}" style="color:{{ fg }};text-decoration:none;font:500 14.5px/1 Manrope, sans-serif;letter-spacing:.01em;padding:10px 0;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:{{ uWorks }};transition:background-size .45s cubic-bezier(.2,.8,.2,1), color .4s" style-hover="background-size:100% 1px">Наши работы</a>
        <a href="Reviews.dc.html" aria-current="{{ curReviews }}" style="color:{{ fg }};text-decoration:none;font:500 14.5px/1 Manrope, sans-serif;letter-spacing:.01em;padding:10px 0;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:{{ uReviews }};transition:background-size .45s cubic-bezier(.2,.8,.2,1), color .4s" style-hover="background-size:100% 1px">Отзывы</a>
        <a href="Quiz.dc.html" aria-current="{{ curQuiz }}" style="color:{{ fg }};text-decoration:none;font:500 14.5px/1 Manrope, sans-serif;letter-spacing:.01em;padding:10px 0;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 100%;background-size:{{ uQuiz }};transition:background-size .45s cubic-bezier(.2,.8,.2,1), color .4s" style-hover="background-size:100% 1px">Дизайн-проект</a>
        <sc-if value="{{ phone }}" hint-placeholder-val="{{ false }}">
          <a href="{{ phoneHref }}" style="color:{{ fg }};text-decoration:none;font:600 14.5px/1 Manrope, sans-serif;font-variant-numeric:tabular-nums">{{ phone }}</a>
        </sc-if>
        <a href="Reviews.dc.html#leave" style="display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 22px;border-radius:999px;border:1px solid {{ ctaBorder }};color:{{ fg }};text-decoration:none;font:600 14px/1 Manrope, sans-serif;transition:background-color .35s, color .35s, border-color .35s" style-hover="background:#B98D5E;border-color:#B98D5E;color:#14120F">Оставить отзыв</a>
      </nav>
    </sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" aria-label="Меню" aria-expanded="{{ openStr }}" onClick="{{ toggle }}" style="margin-left:auto;width:46px;height:46px;border-radius:999px;border:1px solid {{ ctaBorder }};background:transparent;color:{{ fg }};cursor:pointer;display:grid;place-items:center">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="{{ burgerPath }}"></path></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ false }}">
    <nav aria-label="Мобильное меню" style="background:#F4F1EC;border-top:1px solid #E2DCD3;padding:8px clamp(20px,4vw,56px) 28px;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(20,18,15,.35)">
      <a href="Works.dc.html" style="padding:18px 0;border-bottom:1px solid #E2DCD3;color:#1A1714;text-decoration:none;font:300 26px/1.1 'Noto Serif Display', serif">Наши работы</a>
      <a href="Reviews.dc.html" style="padding:18px 0;border-bottom:1px solid #E2DCD3;color:#1A1714;text-decoration:none;font:300 26px/1.1 'Noto Serif Display', serif">Отзывы</a>
      <a href="Quiz.dc.html" style="padding:18px 0;border-bottom:1px solid #E2DCD3;color:#1A1714;text-decoration:none;font:300 26px/1.1 'Noto Serif Display', serif">Дизайн-проект</a>
      <sc-if value="{{ phone }}" hint-placeholder-val="{{ false }}">
        <a href="{{ phoneHref }}" style="padding:18px 0;border-bottom:1px solid #E2DCD3;color:#1A1714;text-decoration:none;font:600 16px Manrope, sans-serif">{{ phone }}</a>
      </sc-if>
      <a href="Reviews.dc.html#leave" style="margin-top:22px;display:flex;align-items:center;justify-content:center;height:54px;border-radius:999px;background:#1A1714;color:#FBFAF7;text-decoration:none;font:600 15px Manrope, sans-serif">Оставить отзыв</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;200px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;works&quot;,&quot;reviews&quot;,&quot;quiz&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled: false, open: false, w: 1280, phone: '' };
  boot() {
    return window.__asdBoot || (window.__asdBoot = ['js/config.js', 'js/works-data.js', 'js/api.js'].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = (window.__resources && window.__resources[src]) || src; s.onload = res; s.onerror = res; document.head.appendChild(s);
    })), Promise.resolve()));
  }
  componentDidMount() {
    this.onS = () => { const s = window.scrollY > 24; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onR = () => this.setState({ w: window.innerWidth, open: window.innerWidth > 900 ? false : this.state.open });
    window.addEventListener('scroll', this.onS, { passive: true });
    window.addEventListener('resize', this.onR);
    this.onS(); this.onR();
    this.boot().then(() => this.setState({ phone: (window.SITE || {}).phone || '' }));
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onS); window.removeEventListener('resize', this.onR); }
  renderVals() {
    const active = this.props.active || '';
    const overHero = this.props.tone === 'dark' && !this.state.scrolled && !this.state.open;
    const desktop = this.state.w > 900;
    const u = (k) => (active === k ? '100% 1px' : '0% 1px');
    const phone = this.state.phone;
    return {
      desktop, mobile: !desktop, panelOpen: !desktop && this.state.open, openStr: String(this.state.open),
      bg: overHero ? 'transparent' : 'rgba(244,241,236,.86)',
      border: overHero ? 'rgba(255,255,255,0)' : '#E2DCD3',
      blur: overHero ? 'none' : 'blur(18px) saturate(1.3)',
      h: this.state.scrolled ? '68px' : '84px',
      fg: overHero ? '#FBFAF7' : '#1A1714',
      ctaBorder: overHero ? 'rgba(251,250,247,.5)' : 'rgba(26,23,20,.28)',
      logo: ((u) => (window.__resources && window.__resources[u]) || u)(overHero ? 'img/logo-light.svg' : 'img/logo.svg'),
      uWorks: u('works'), uReviews: u('reviews'), uQuiz: u('quiz'),
      curWorks: active === 'works' ? 'page' : undefined, curReviews: active === 'reviews' ? 'page' : undefined, curQuiz: active === 'quiz' ? 'page' : undefined,
      phone, phoneHref: 'tel:' + phone.replace(/[^+\d]/g, ''),
      burgerPath: this.state.open ? 'M2 1l14 10M2 11L16 1' : 'M0 1h18M0 6h18M0 11h18',
      toggle: () => this.setState((s) => ({ open: !s.open })),
    };
  }
}
</script>
</body>
</html>
