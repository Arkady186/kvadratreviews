<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка — ASD</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="section section--tight">
    <div class="wrap">
      <div class="page-hero" style="padding-top:0">
        <h1>Админка</h1>
        <p class="lead" id="sub">Войдите, чтобы видеть заявки, отзывы и ошибки сайта.</p>
      </div>

      <div class="admin-box form-card" id="login-box">
        <div class="form-error" id="l-err" role="alert"></div>
        <form id="login" novalidate>
          <div class="field"><label for="l-email">Эл. почта</label><input class="input" id="l-email" type="email" autocomplete="username" required></div>
          <div class="field"><label for="l-pass">Пароль</label><input class="input" id="l-pass" type="password" autocomplete="current-password" required></div>
          <button class="btn btn--ink" type="submit">Войти</button>
        </form>
      </div>

      <div id="panel" hidden>
        <div class="admin-tabs">
          <div class="adm-top" id="top" role="tablist" style="margin:0 0 -1px"></div>
          <button class="btn btn--sm" id="refresh" type="button" style="margin-left:auto">Обновить</button>
          <button class="btn btn--sm" id="logout" type="button">Выйти</button>
        </div>
        <div class="filters" id="tabs"></div>
        <div id="list" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/works-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script>
    Chrome.init('admin');
    const { esc, stars, fmtDate } = Chrome;
    const $ = (id) => document.getElementById(id);
    const CATS = window.WORKS.categories;
    const RV_STATUS = { pending: 'На проверке', approved: 'Опубликованные', hidden: 'Скрытые' };
    const LD_STATUS = { new: 'Новые', work: 'В работе', done: 'Завершённые' };
    const EMPTY = { new: 'Новых заявок пока нет.', work: 'Нет заявок в работе.', done: 'Завершённых заявок пока нет.' };
    const BG_STATUS = { new: 'Новые', fixed: 'Исправлено' };
    const BG_KIND = { bug: 'Ошибка', ui: 'Неудобно / криво', idea: 'Предложение', other: 'Другое' };
    let reviews = [], leads = [], leadsErr = '', bugs = [], bugsErr = '', section = 'leads', tab = { leads: 'new', reviews: 'pending', bugs: 'new' };
    const fmtDT = (iso) => { try { return new Date(iso).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
    const ICON_FILE = { pdf: 'PDF', other: 'ФАЙЛ' };

    async function load() {
      const [rv, ld, bg] = await Promise.allSettled([Api.adminList(), Api.adminLeads(), Api.adminBugs()]);
      const authFail = [rv, ld, bg].some((r) => r.status === 'rejected' && r.reason && r.reason.code === 'auth');
      if (authFail) { Api.adminLogout(); showLogin('Сессия закончилась. Войдите снова.'); return; }
      reviews = rv.status === 'fulfilled' ? rv.value : [];
      leadsErr = ''; leads = [];
      if (ld.status === 'fulfilled') leads = ld.value;
      else leadsErr = (ld.reason && (ld.reason.status === 404 || /schema cache|does not exist|PGRST205/i.test(ld.reason.message || '')))
        ? 'Таблица заявок ещё не создана. Откройте в Supabase SQL Editor файл supabase/leads.sql и выполните его (см. README.md).'
        : (ld.reason && ld.reason.message) || 'Не удалось загрузить заявки.';
      bugsErr = ''; bugs = [];
      if (bg.status === 'fulfilled') bugs = bg.value;
      else bugsErr = (bg.reason && (bg.reason.status === 404 || /schema cache|does not exist|PGRST205/i.test(bg.reason.message || '')))
        ? 'Таблица ошибок ещё не создана. Откройте в Supabase SQL Editor файл supabase/support_and_once.sql и выполните его (см. README.md).'
        : (bg.reason && bg.reason.message) || 'Не удалось загрузить сообщения.';
      render();
    }

    function render() {
      const nNew = leads.filter((l) => l.status === 'new').length, nPend = reviews.filter((r) => r.status === 'pending').length, nBug = bugs.filter((b) => b.status === 'new').length;
      document.title = (nNew + nBug ? '(' + (nNew + nBug) + ') ' : '') + 'Админка — ASD';
      $('top').innerHTML = [['leads', 'Заявки', nNew], ['reviews', 'Отзывы', nPend], ['bugs', 'Ошибки сайта', nBug]].map(([id, t, n]) =>
        `<button class="chip" type="button" role="tab" data-s="${id}" aria-pressed="${id === section}">${t}${n ? `<small style="opacity:1;color:var(--brass-d);font-weight:600">${n} нов.</small>` : ''}</button>`).join('');
      const map = { leads: LD_STATUS, reviews: RV_STATUS, bugs: BG_STATUS }[section], src = { leads, reviews, bugs }[section];
      $('tabs').innerHTML = Object.keys(map).map((s) => `<button class="chip" type="button" data-t="${s}" aria-pressed="${s === tab[section]}">${map[s]}<small>${src.filter((x) => x.status === s).length}</small></button>`).join('');
      $('sub').textContent = { leads: 'Заявки из опросника: имя, телефон и ответы клиента.', reviews: 'Новые отзывы видны на сайте только после публикации.', bugs: 'Сообщения посетителей из кнопки «Поддержка сайта».' }[section];
      if (section === 'leads') renderLeads(); else if (section === 'bugs') renderBugs(); else renderReviews();
    }

    /* ---------- Заявки ---------- */
    function renderLeads() {
      if (leadsErr) { $('list').innerHTML = `<div class="empty"><h3>Заявки недоступны</h3><p>${esc(leadsErr)}</p></div>`; return; }
      const list = leads.filter((l) => l.status === tab.leads);
      if (!list.length) { $('list').innerHTML = `<div class="empty"><h3>Здесь пусто</h3><p>${EMPTY[tab.leads]}</p></div>`; return; }
      $('list').innerHTML = list.map((l) => {
        const tel = String(l.phone || '').replace(/[^+\d]/g, '');
        const items = (l.items || []).filter((i) => !(l.items_other && i === 'Другое')).map((i) => `<span>${esc(i)}</span>`).join('');
        const row = (t, v) => v ? `<div><dt>${t}</dt><dd>${v}</dd></div>` : '';
        const files = (l.files || []).map((f, i) => `<a href="#" data-file="${esc(f.path)}" data-name="${esc(f.name)}" target="_blank" rel="noopener" title="${esc(f.name)}"><span class="th" data-th="${esc(f.path)}">${/^image\/(jpeg|png|webp)/.test(f.type) ? '' : (/pdf/.test(f.type) ? 'PDF' : 'ФАЙЛ')}</span><span class="nm">${esc(f.name)}</span></a>`).join('');
        return `
        <article class="ld ${l.status === 'done' ? 'ld--done' : ''}" data-lid="${esc(l.id)}">
          <div class="ld__head">
            <span class="ld__name">${esc(l.name)}</span>
            <a class="ld__phone" href="tel:${esc(tel)}">${esc(l.phone)}</a>
            <button class="btn btn--sm" type="button" data-copy-phone="${esc(l.phone)}">Скопировать номер</button>
            <span class="ld__date">${fmtDT(l.created_at)}</span>
          </div>
          <dl class="ld__rows">
            ${row('Что нужно', `<div class="ld__chips">${items}${l.items_other ? `<span>Другое: ${esc(l.items_other)}</span>` : ''}</div>`)}
            ${row('Стадия ремонта', esc(l.stage))}
            ${row('План или проект', esc(l.plan))}
            ${row('Комментарий', l.comment ? esc(l.comment).replace(/\n/g, '<br>') : '')}
            ${row('Файлы', files ? `<div class="ld__files">${files}</div>` : '')}
          </dl>
          <textarea class="textarea ld__note" data-note="${esc(l.id)}" placeholder="Заметка для себя: о чём договорились, что уточнить" maxlength="1500">${esc(l.admin_note || '')}</textarea>
          <div class="adm__actions">
            ${l.status === 'new' ? `<button class="btn btn--brass btn--sm" data-la="work" data-id="${esc(l.id)}">Взять в работу</button>` : ''}
            ${l.status !== 'done' ? `<button class="btn btn--ink btn--sm" data-la="done" data-id="${esc(l.id)}">Завершить</button>` : ''}
            ${l.status !== 'new' ? `<button class="btn btn--sm" data-la="new" data-id="${esc(l.id)}">Вернуть в новые</button>` : ''}
            <button class="btn btn--sm" data-la="delete" data-id="${esc(l.id)}">Удалить</button>
          </div>
        </article>`;
      }).join('');
      signThumbs(list);
    }
    const signed = {};                                   // path → временная ссылка
    async function signThumbs(list) {
      const need = list.flatMap((l) => (l.files || []).map((f) => f.path)).filter((p) => p && !signed[p]);
      if (need.length) { try { Object.assign(signed, await Api.adminSignFiles(need)); } catch (e) { /* покажем без превью */ } }
      document.querySelectorAll('[data-file]').forEach((a) => {
        const u = signed[a.dataset.file]; if (!u) return; a.href = u;
        const th = a.querySelector('.th'); const f = leads.flatMap((l) => l.files || []).find((x) => x.path === a.dataset.file);
        if (f && /^image\/(jpeg|png|webp)/.test(f.type) && !th.querySelector('img')) { th.innerHTML = `<img src="${esc(u)}" alt="" loading="lazy">`; }
      });
    }
    $('list').addEventListener('click', async (e) => {
      const fa = e.target.closest('[data-file]');
      if (fa && fa.getAttribute('href') === '#') { e.preventDefault(); Chrome.toast('Ссылка на файл ещё готовится, попробуйте через секунду.'); return; }
      const cp = e.target.closest('[data-copy-phone]');
      if (cp) { try { await navigator.clipboard.writeText(cp.dataset.copyPhone); Chrome.toast('Номер скопирован'); } catch (er) { Chrome.toast(cp.dataset.copyPhone); } return; }
      const b = e.target.closest('[data-la]'); if (b) return leadAction(b);
      const r = e.target.closest('[data-a]'); if (r) return reviewAction(r);
      const g = e.target.closest('[data-ba]'); if (g) return bugAction(g);
    });
    $('list').addEventListener('focusout', async (e) => {                // заметка сохраняется, когда выходите из поля
      const t = e.target.closest('[data-note]'); if (!t) return;
      const l = leads.find((x) => String(x.id) === t.dataset.note); const v = t.value.trim();
      if (!l || (l.admin_note || '') === v) return;
      try { await Api.adminLeadPatch(l.id, { admin_note: v || null }); l.admin_note = v || null; Chrome.toast('Заметка сохранена'); }
      catch (er) { Chrome.toast('Заметку не удалось сохранить'); }
    });
    async function leadAction(b) {
      const id = b.dataset.id, a = b.dataset.la, l = leads.find((x) => String(x.id) === id); if (!l) return;
      if (a === 'delete' && !confirm('Удалить заявку «' + l.name + '» вместе с файлами? Это нельзя отменить.')) return;
      b.disabled = true;
      try {
        if (a === 'delete') await Api.adminLeadDelete(l); else await Api.adminLeadPatch(id, { status: a });
        await load();
      } catch (er) { b.disabled = false; Chrome.toast(er.message || 'Не получилось. Попробуйте ещё раз.'); }
    }

    /* ---------- Ошибки сайта ---------- */
    function device(ua) {
      ua = String(ua || '');
      const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'устройство';
      const br = /YaBrowser/.test(ua) ? 'Яндекс Браузер' : /EdgA?\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung' : /(Chrome|CriOS)\//.test(ua) ? 'Chrome' : /(Firefox|FxiOS)\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'браузер';
      return os + ', ' + br;
    }
    function renderBugs() {
      if (bugsErr) { $('list').innerHTML = `<div class="empty"><h3>Ошибки недоступны</h3><p>${esc(bugsErr)}</p></div>`; return; }
      const list = bugs.filter((b) => b.status === tab.bugs);
      if (!list.length) { $('list').innerHTML = `<div class="empty"><h3>Здесь пусто</h3><p>${tab.bugs === 'new' ? 'Новых сообщений об ошибках нет.' : 'Исправленных пока нет.'}</p></div>`; return; }
      $('list').innerHTML = list.map((b) => {
        const row = (t, v) => v ? `<div><dt>${t}</dt><dd>${v}</dd></div>` : '';
        const page = b.page ? `<a href="${esc(b.page.split('?')[0] || 'index.html')}${b.page.includes('?') ? esc('?' + b.page.split('?').slice(1).join('?')) : ''}" target="_blank" rel="noopener">${esc(b.page)}</a>` : '';
        return `
        <article class="ld ${b.status === 'fixed' ? 'ld--done' : ''}">
          <div class="ld__head">
            <span class="ld__name">${esc(BG_KIND[b.kind] || b.kind)}</span>
            ${b.contact ? `<span class="ld__phone">${esc(b.contact)}</span>` : '<span class="muted">контакт не указан</span>'}
            <span class="ld__date">${fmtDT(b.created_at)}</span>
          </div>
          <p style="overflow-wrap:anywhere;margin:0 0 12px;line-height:1.6">${esc(b.message).replace(/\n/g, '<br>')}</p>
          <dl class="ld__rows">
            ${row('Страница', page)}
            ${row('Устройство', esc(device(b.ua)) + (b.viewport ? ' · экран ' + esc(b.viewport) : ''))}
            ${row('Ошибка в коде', b.err ? `<code style="overflow-wrap:anywhere">${esc(b.err)}</code>` : '')}
          </dl>
          <div class="adm__actions">
            ${b.status === 'new' ? `<button class="btn btn--brass btn--sm" data-ba="fixed" data-id="${esc(b.id)}">Исправлено</button>` : `<button class="btn btn--sm" data-ba="new" data-id="${esc(b.id)}">Вернуть в новые</button>`}
            <button class="btn btn--sm" data-ba="delete" data-id="${esc(b.id)}">Удалить</button>
          </div>
        </article>`;
      }).join('');
    }
    async function bugAction(b) {
      const id = b.dataset.id, a = b.dataset.ba;
      if (a === 'delete' && !confirm('Удалить сообщение? Это нельзя отменить.')) return;
      b.disabled = true;
      try { if (a === 'delete') await Api.adminBugDelete(id); else await Api.adminBugPatch(id, { status: a }); await load(); }
      catch (er) { b.disabled = false; Chrome.toast(er.message || 'Не получилось. Попробуйте ещё раз.'); }
    }

    /* ---------- Отзывы ---------- */
    function renderReviews() {
      const fpCount = {}; reviews.forEach((r) => { if (r.fp) fpCount[r.fp] = (fpCount[r.fp] || 0) + 1; });
      const list = reviews.filter((r) => r.status === tab.reviews);
      $('list').innerHTML = list.length ? list.map((r) => `
        <article class="adm">
          <div class="adm__top"><strong>${esc(r.name)}</strong>${stars(r.rating)}
            <span class="muted">${fmtDate(r.created_at)}</span>
            ${r.topic ? `<span class="tag">${esc((CATS.find((c) => c.id === r.topic) || {}).title || r.topic)}</span>` : ''}
            ${r.fp && fpCount[r.fp] > 1 ? '<span class="badge-warn">Похожее устройство уже оставляло отзыв</span>' : ''}</div>
          <p style="overflow-wrap:anywhere">${esc(r.body)}</p>
          <div class="adm__actions">
            ${r.status !== 'approved' ? `<button class="btn btn--brass btn--sm" data-a="approved" data-id="${r.id}">Опубликовать</button>` : ''}
            ${r.status !== 'hidden' ? `<button class="btn btn--sm" data-a="hidden" data-id="${r.id}">Скрыть</button>` : ''}
            <button class="btn btn--sm" data-a="delete" data-id="${r.id}">Удалить</button>
          </div>
        </article>`).join('') : `<div class="empty"><h3>Здесь пусто</h3><p>${tab.reviews === 'pending' ? 'Новых отзывов на проверку нет.' : 'В этом списке нет отзывов.'}</p></div>`;
    }
    async function reviewAction(b) {
      const id = b.dataset.id, a = b.dataset.a;
      if (a === 'delete' && !confirm('Удалить отзыв насовсем? Этот человек сможет оставить новый.')) return;
      b.disabled = true;
      try {
        if (a === 'delete') await Api.adminDelete(id); else await Api.adminSet(id, a);
        await load();
      } catch (er) { b.disabled = false; Chrome.toast(er.message || 'Не получилось. Попробуйте ещё раз.'); }
    }

    $('top').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) { section = b.dataset.s; render(); } });
    $('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { tab[section] = b.dataset.t; render(); } });
    $('refresh').onclick = async () => { $('refresh').disabled = true; await load(); $('refresh').disabled = false; Chrome.toast('Обновлено'); };
    setInterval(() => { if (!document.hidden && !$('panel').hidden && !document.activeElement.matches('textarea')) load(); }, 90000);

    function showLogin(msg) {
      $('panel').hidden = true; $('login-box').hidden = false;
      $('sub').textContent = 'Войдите, чтобы видеть заявки и проверять отзывы.';
      const err = $('l-err'); err.textContent = msg || ''; err.classList.toggle('is-on', !!msg);
    }
    function showPanel() { $('login-box').hidden = true; $('panel').hidden = false; load(); }

    $('login').addEventListener('submit', async (e) => {
      e.preventDefault(); const err = $('l-err'); err.classList.remove('is-on');
      const btn = e.target.querySelector('button'); btn.disabled = true;
      try { await Api.adminLogin($('l-email').value.trim(), $('l-pass').value); showPanel(); }
      catch (er) { err.textContent = /invalid|credentials/i.test(er.message) ? 'Неверная почта или пароль.' : er.message; err.classList.add('is-on'); }
      btn.disabled = false;
    });
    $('logout').onclick = () => { Api.adminLogout(); showLogin(); };
    if (!Api.configured) showLogin('Хранилище не подключено (см. README.md).');
    else if (Api.adminToken()) showPanel(); else showLogin();
  </script>
</body>
</html>
