<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Наши работы — Квадрат</title>
  <meta name="description" content="Фото наших работ: кухни, шкафы, санузлы, ТВ-зоны и офисная мебель на заказ.">
  <meta name="theme-color" content="#F4F3F0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316201C'/%3E%3Crect x='7' y='7' width='16' height='16' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='19' y='19' width='7' height='7' fill='%23B8924A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="wrap page-hero__row">
        <div>
          <h1>Наши работы</h1>
          <p class="lead" id="cat-text">Фотографии готовых проектов. Выберите раздел.</p>
        </div>
        <button class="btn btn--sm" type="button" id="share" data-copy="works.html">Скопировать ссылку на раздел</button>
      </div>
    </section>

    <section class="section section--tight">
      <div class="wrap">
        <div class="filters" id="cats" role="group" aria-label="Разделы"></div>
        <div class="filters" id="subs" role="group" aria-label="Подразделы" hidden></div>
        <p class="works-count" id="count"></p>
        <div class="works-grid" id="grid"></div>
        <div id="empty" hidden></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Просмотр фото">
    <button class="lb__btn lb__close" id="lb-close" aria-label="Закрыть">✕</button>
    <button class="lb__btn lb__prev" id="lb-prev" aria-label="Предыдущее фото">‹</button>
    <img class="lb__img" id="lb-img" alt="">
    <button class="lb__btn lb__next" id="lb-next" aria-label="Следующее фото">›</button>
    <div class="lb__count" id="lb-count"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/works-data.js"></script>
  <script src="js/common.js"></script>
  <script>
    Chrome.init('works');
    const { esc, ICONS } = Chrome;
    const W = window.WORKS, $ = (id) => document.getElementById(id);
    const counts = Chrome.counts();
    const params = new URLSearchParams(location.search);
    let cat = W.categories.some((c) => c.id === params.get('c')) ? params.get('c') : 'all';
    let sub = 'all', view = [], idx = 0;

    function setUrl() {
      const u = new URL(location.href); if (cat === 'all') u.searchParams.delete('c'); else u.searchParams.set('c', cat);
      history.replaceState(null, '', u);
      $('share').setAttribute('data-copy', cat === 'all' ? 'works.html' : 'works.html?c=' + cat);
    }

    function renderCats() {
      const chips = [['all', 'Все работы', W.items.length]].concat(W.categories.map((c) => [c.id, c.title, counts[c.id] || 0]));
      $('cats').innerHTML = chips.map(([id, t, n]) => `<button class="chip" type="button" data-c="${id}" aria-pressed="${id === cat}">${esc(t)}<small>${n}</small></button>`).join('');
    }
    function renderSubs() {
      const subs = [...new Set(W.items.filter((i) => (cat === 'all' || i.cat === cat) && i.sub).map((i) => i.sub))];
      $('subs').hidden = !subs.length || cat === 'all';
      if (sub !== 'all' && !subs.includes(sub)) sub = 'all';
      $('subs').innerHTML = subs.length ? [['all', 'Все']].concat(subs.map((s) => [s, s])).map(([id, t]) => `<button class="chip" type="button" data-s="${esc(id)}" aria-pressed="${id === sub}">${esc(t)}</button>`).join('') : '';
    }
    function renderGrid() {
      const c = W.categories.find((x) => x.id === cat);
      $('cat-text').textContent = c ? c.text : 'Фотографии готовых проектов. Выберите раздел.';
      view = W.items.filter((i) => (cat === 'all' || i.cat === cat) && (sub === 'all' || i.sub === sub));
      $('count').textContent = view.length ? Chrome.photosWord(view.length) : '';
      $('empty').hidden = !!view.length;
      if (!view.length) {
        $('empty').innerHTML = `<div class="empty">${ICONS[cat === 'all' ? 'camera' : cat]}<h3>Фото появятся здесь</h3><p>Мы готовим подборку этого раздела. Загляните чуть позже — или посмотрите другие работы.</p></div>`;
      }
      $('grid').innerHTML = view.map((it, i) => `
        <button class="work" type="button" data-i="${i}" aria-label="Открыть фото ${i + 1}">
          <img src="${esc(it.thumb)}" alt="${esc((W.categories.find((x) => x.id === it.cat) || {}).title || 'Работа')}" width="${it.tw || 600}" height="${it.th || 600}" loading="lazy" decoding="async">
        </button>`).join('');
    }
    function renderAll() { setUrl(); renderCats(); renderSubs(); renderGrid(); }

    $('cats').addEventListener('click', (e) => { const b = e.target.closest('[data-c]'); if (b) { cat = b.dataset.c; sub = 'all'; renderAll(); } });
    $('subs').addEventListener('click', (e) => { const b = e.target.closest('[data-s]'); if (b) { sub = b.dataset.s; renderSubs(); renderGrid(); } });
    $('grid').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) open(Number(b.dataset.i), b); });

    /* ----- Просмотр фото ----- */
    let lastFocus = null;
    function show() {
      const it = view[idx]; if (!it) return;
      $('lb-img').src = it.full; $('lb-img').alt = '';
      $('lb-count').textContent = (idx + 1) + ' из ' + view.length;
      [view[idx + 1], view[idx - 1]].forEach((n) => { if (n) new Image().src = n.full; });
      $('lb-prev').style.visibility = $('lb-next').style.visibility = view.length > 1 ? 'visible' : 'hidden';
    }
    function open(i, from) { idx = i; lastFocus = from; $('lb').classList.add('is-open'); document.body.style.overflow = 'hidden'; show(); $('lb-close').focus(); }
    function close() { $('lb').classList.remove('is-open'); document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
    const step = (d) => { idx = (idx + d + view.length) % view.length; show(); };
    $('lb-close').onclick = close; $('lb-prev').onclick = () => step(-1); $('lb-next').onclick = () => step(1);
    $('lb').addEventListener('click', (e) => { if (e.target === $('lb')) close(); });
    document.addEventListener('keydown', (e) => {
      if (!$('lb').classList.contains('is-open')) return;
      if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
    });
    let sx = null;
    $('lb').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    $('lb').addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });

    renderAll();
  </script>
</body>
</html>
