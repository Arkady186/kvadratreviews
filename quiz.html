<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дизайн-проект мебели для вашего дома — ASD</title>
  <meta name="description" content="Ответьте на несколько коротких вопросов, и дизайнер подготовит проект мебели для вашего дома.">
  <meta name="theme-color" content="#F4F1EC">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+Display:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #F4F1EC; color: #1A1714; font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    a { color: inherit; } a:hover { color: #8C6239; }
    ::selection { background: #C9A074; color: #14120F; }
    :focus-visible { outline: 2px solid #B98D5E; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
<link rel="stylesheet" href="css/dc.css">
</head>
<body>
<div data-dc="Quiz" style="display:contents"></div>
<noscript><p style="padding:40px;font:16px sans-serif">Для работы сайта нужен включённый JavaScript.</p></noscript>
<script src="js/dc.js"></script>
<script src="js/dc-site.js"></script>
<script>
DC.define("Quiz",(function(){
class Component extends DCLogic {
  ITEMS = ['Комплексную меблировку квартиры', 'Кухню', 'Шкаф или гардеробную', 'Мебель в прихожую', 'Мебель в гостиную', 'Мебель в спальню', 'Детскую', 'Мебель для ванной', 'Рабочую зону или домашний кабинет', 'Другое'];
  STAGES = ['Планируем ремонт', 'Идёт черновой ремонт', 'Сейчас делаем электрику и сантехнику', 'Идёт чистовая отделка', 'Ремонт почти завершён', 'Квартира с ремонтом', 'Свой вариант'];
  PLANS = ['Да, есть дизайн-проект', 'Есть план с размерами', 'Есть только планировка от застройщика', 'Пока ничего нет'];
  TITLES = ['', 'Кухонная техника', 'Кухонная техника', 'Кухонная техника', 'Кухонная техника', 'Кухонная техника', 'Мебель', 'Ремонт', 'План', 'Контакты'];
  KQ = [
    { key: 'bought', title: 'Кухонная техника уже куплена?', hint: 'Так дизайнер заранее учтёт размеры, ниши и подключения.', opts: ['Да, вся техника уже куплена', 'Куплена часть техники', 'Нет, пока ничего не куплено'] },
    { key: 'fridge', title: 'Какой холодильник вы планируете установить?', hint: 'Встраиваемый прячется за фасадом, отдельностоящий остаётся на виду.', opts: ['Встраиваемый', 'Отдельностоящий', 'Ещё не решил(а)'] },
    { key: 'dishwasher', title: 'Планируете установить посудомоечную машину?', hint: 'От ширины зависит, сколько места останется под шкафы.', opts: ['Да, 45 см', 'Да, 60 см', 'Нет', 'Пока не решил(а)'] },
    { key: 'microwave', title: 'Какую микроволновую печь вы рассматриваете?', hint: 'Встраиваемую мы вписываем в шкаф, отдельностоящей подбираем место.', opts: ['Встраиваемую', 'Отдельностоящую', 'Ещё не решил(а)'] },
    { key: 'oven', title: 'Где вы хотите разместить духовой шкаф?', hint: 'В высоком пенале духовка на уровне рук, под варочной панелью — компактнее и дешевле.', opts: ['В пенале', 'Под варочной панелью', 'Ещё не решил(а)'] },
  ];
  KEYS = ['bought', 'fridge', 'dishwasher', 'microwave', 'oven'];
  K = 5; LAST = 9; OTHER_ITEM = 9; OTHER_STAGE = 6;
  state = { ready: false, w: 1280, step: 1, items: [], itemsOther: '', stage: -1, stageOther: '', plan: -1, name: '', phone: '', comment: '', consent: false, site: '',
    kitchen: [-1, -1, -1, -1, -1], skipped: false, files: [], stepErr: '', errs: {}, sendErr: '', sending: false, sendLabel: '', over: false, result: null };
  formRef = React.createRef(); titleRef = React.createRef(); nameRef = React.createRef(); phoneRef = React.createRef(); doneRef = React.createRef();
  itemsOtherRef = React.createRef(); stageOtherRef = React.createRef();
  reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  boot() {
    return window.__asdBoot || (window.__asdBoot = ['js/config.js', 'js/works-data.js', 'js/api.js'].reduce((p, src) => p.then(() => new Promise((res) => {
      const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s);
    })), Promise.resolve()));
  }
  componentDidMount() {
    try { const saved = JSON.parse(sessionStorage.getItem('kv_quiz') || '{}'); const k = ['kitchen', 'skipped', 'items', 'itemsOther', 'stage', 'stageOther', 'plan', 'name', 'phone', 'comment']; const o = {}; k.forEach((x) => { if (saved[x] !== undefined) o[x] = saved[x]; }); this.setState(o); } catch (e) {}
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR); this.onR();
    this.onUnload = (e) => { if (!this.state.result && this.state.files.length) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', this.onUnload);
    if (!this.reduce) document.querySelectorAll('[data-in]').forEach((el) => el.animate([{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { duration: 1100, delay: 100, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
    this.boot().then(() => {
      this.setState({ ready: true });
      const A = window.Api; if (!A) return;
      if (A.leadSentQuick()) this.already(); else A.myLeadStatus().then((r) => { if (r === 'sent') this.already(); });
    });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('beforeunload', this.onUnload); }
  save() { const s = this.state; try { sessionStorage.setItem('kv_quiz', JSON.stringify({ kitchen: s.kitchen, skipped: s.skipped, items: s.items, itemsOther: s.itemsOther, stage: s.stage, stageOther: s.stageOther, plan: s.plan, name: s.name, phone: s.phone, comment: s.comment })); } catch (e) {} }
  set(o, cb) { this.setState(o, () => { this.save(); cb && cb(); }); }

  fmtPhone(v) {
    let d = v.replace(/\D/g, ''); if (!d) return '';
    if (d[0] === '8') d = '7' + d.slice(1);
    if (d[0] !== '7' && v.trim()[0] !== '+') d = '7' + d;
    if (v.trim()[0] === '+' && d[0] !== '7') return '+' + d.slice(0, 15);
    d = d.slice(0, 11);
    let o = '+7';
    if (d.length > 1) o += ' (' + d.slice(1, 4); if (d.length >= 4) o += ')'; if (d.length > 4) o += ' ' + d.slice(4, 7);
    if (d.length > 7) o += '-' + d.slice(7, 9); if (d.length > 9) o += '-' + d.slice(9, 11);
    return o;
  }
  phoneOk(v) { const d = v.replace(/\D/g, ''); return (d.length === 11 && d[0] === '7') || (v.trim()[0] === '+' && d.length >= 10 && d.length <= 15); }
  onPhone(e) {
    const el = e.target, it = e.nativeEvent && e.nativeEvent.inputType;
    if (it && it.startsWith('delete') && el.selectionStart !== el.value.length) { this.set({ phone: el.value }); return; }
    if (it && it.startsWith('delete') && el.value.replace(/\D/g, '').length <= 1) { this.set({ phone: '' }); return; }
    this.set({ phone: this.fmtPhone(el.value), errs: Object.assign({}, this.state.errs, { phone: false }) });
  }

  okType(f) { return /^image\//.test(f.type) || f.type === 'application/pdf' || /\.(pdf|heic|heif|jpe?g|png|webp)$/i.test(f.name); }
  addFiles(list) {
    const err = [], files = this.state.files.slice(), MAX = (window.Api && window.Api.MAX_FILES) || 8;
    [...list].forEach((f) => {
      if (!this.okType(f)) { err.push('«' + f.name + '»: подходят только фото и PDF.'); return; }
      if (files.some((x) => x.name === f.name && x.size === f.size)) return;
      if (files.length >= MAX) { err.push('Можно прикрепить не больше ' + MAX + ' файлов.'); return; }
      if (f.size > 40 * 1024 * 1024) { err.push('«' + f.name + '» слишком большой.'); return; }
      if (/^image\/(jpeg|png|webp|gif)/.test(f.type)) f._url = URL.createObjectURL(f);
      files.push(f);
    });
    this.setState({ files, stepErr: [...new Set(err)].join(' ') });
  }

  validate(n) {
    const s = this.state;
    if (n >= 1 && n <= this.K) { if (s.kitchen[n - 1] < 0) return this.err('Выберите один из вариантов или пропустите вопросы о технике.'); return true; }
    n -= this.K;
    if (n === 1) {
      if (!s.items.length) return this.err('Выберите хотя бы один вариант.');
      if (s.items.includes(this.OTHER_ITEM) && !s.itemsOther.trim()) { this.itemsOtherRef.current && this.itemsOtherRef.current.focus(); return this.err('Напишите, какая мебель вам нужна, или уберите «Другое».'); }
    }
    if (n === 2) {
      if (s.stage < 0) return this.err('Выберите, на каком этапе ремонт.');
      if (s.stage === this.OTHER_STAGE && !s.stageOther.trim()) { this.stageOtherRef.current && this.stageOtherRef.current.focus(); return this.err('Опишите свой вариант.'); }
    }
    if (n === 3 && s.plan < 0) return this.err('Выберите один из вариантов.');
    if (n === 4) {
      const errs = { name: s.name.trim().length < 2, phone: !this.phoneOk(s.phone), consent: !s.consent };
      this.setState({ errs });
      if (errs.name) { this.nameRef.current && this.nameRef.current.focus(); return false; }
      if (errs.phone) { this.phoneRef.current && this.phoneRef.current.focus(); return false; }
      if (errs.consent) return false;
    }
    return true;
  }
  err(m) { this.setState({ stepErr: m }); return false; }
  go(n) {
    this.setState({ step: n, stepErr: '' }, () => {
      const h = this.titleRef.current; if (h) h.focus({ preventScroll: true });
      const step = document.querySelector('[data-qstep]');
      if (step && !this.reduce) step.animate([{ opacity: 0, transform: 'translateX(18px)' }, { opacity: 1, transform: 'none' }], { duration: 550, easing: 'cubic-bezier(.2,.8,.2,1)' });
      const f = this.formRef.current;
      if (f) { const top = f.getBoundingClientRect().top + window.scrollY - 96; if (Math.abs(window.scrollY - top) > 40) window.scrollTo({ top: Math.max(0, top), behavior: this.reduce ? 'auto' : 'smooth' }); }
    });
  }
  async submit(e) {
    e.preventDefault();
    if (!this.validate(this.state.step)) return;
    if (this.state.step < this.LAST) { this.go(this.state.step + 1); return; }
    await this.send();
  }
  async send() {
    const s = this.state;
    if (s.site) { this.finish(); return; }
    this.setState({ sending: true, sendErr: '', sendLabel: 'Отправляем…' });
    try {
      await window.Api.submitLead({
        kitchen: s.skipped ? null : this.KEYS.reduce((o, k, i) => { if (s.kitchen[i] >= 0) o[k] = this.KQ[i].opts[s.kitchen[i]]; return o; }, {}),
        items: s.items.map((i) => this.ITEMS[i]), itemsOther: s.items.includes(this.OTHER_ITEM) ? s.itemsOther.trim() : '',
        stage: s.stage === this.OTHER_STAGE ? 'Свой вариант: ' + s.stageOther.trim() : this.STAGES[s.stage],
        plan: this.PLANS[s.plan], name: s.name, phone: s.phone, comment: s.comment, files: s.files,
      }, (d, t) => this.setState({ sendLabel: 'Загружаем файлы ' + d + ' из ' + t + '…' }));
      this.finish();
    } catch (er) {
      if (er && er.code === 'duplicate') { this.already(); return; }
      this.setState({ sending: false, sendLabel: '', sendErr: ((er && er.message) || 'Не получилось отправить.') + ' Данные сохранены, нажмите «Отправить заявку» ещё раз.' });
    }
  }
  showResult(result) {
    try { sessionStorage.removeItem('kv_quiz'); } catch (e) {}
    this.setState({ result, sending: false }, () => {
      window.scrollTo({ top: 0, behavior: this.reduce ? 'auto' : 'smooth' });
      if (this.doneRef.current) this.doneRef.current.focus({ preventScroll: true });
      const p = document.querySelector('[data-check]');
      if (p && !this.reduce) p.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 900, delay: 250, easing: 'cubic-bezier(.55,.1,.25,1)', fill: 'both' });
    });
  }
  finish() { this.showResult('sent'); }
  already() { this.showResult('already'); }

  renderVals() {
    const s = this.state, step = s.step;
    const sizeStr = (b) => (b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' МБ' : Math.max(1, Math.round(b / 1024)) + ' КБ');
    const opt = (label, on, multi, pick) => ({
      label, on: String(on), role: multi ? 'checkbox' : 'radio', pick, radius: multi ? '6px' : '999px',
      bd: on ? '#1A1714' : '#E2DCD3', bg: on ? '#fff' : '#F7F4EF', sh: on ? 'inset 3px 0 0 #B98D5E, 0 10px 24px -16px rgba(26,23,20,.4)' : 'none',
      mbd: on ? '#1A1714' : '#B5ACA1', mbg: on ? '#1A1714' : '#fff', chk: on ? 1 : 0, icon: multi ? 'M2 6.2l2.6 2.6L10 3.4' : 'M3.5 6a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0',
    });
    let q = { title: '', hint: '', hasOpts: false, opts: [], groupRole: 'group' };
    if (step <= this.K) { const kq = this.KQ[step - 1]; q = { title: kq.title, hint: kq.hint, hasOpts: true, groupRole: 'radiogroup',
      opts: kq.opts.map((t, i) => opt(t, s.kitchen[step - 1] === i, false, () => { const kitchen = s.kitchen.slice(); kitchen[step - 1] = i; this.set({ kitchen, skipped: false, stepErr: '' }); })) }; }
    if (step === 6) q = { title: 'Что вам необходимо из мебели для уюта вашего дома?', hint: 'Можно выбрать несколько вариантов.', hasOpts: true, groupRole: 'group',
      opts: this.ITEMS.map((t, i) => opt(t, s.items.includes(i), true, () => {
        const items = s.items.includes(i) ? s.items.filter((x) => x !== i) : s.items.concat(i);
        this.set({ items, stepErr: '' }, () => { if (i === this.OTHER_ITEM && items.includes(i)) setTimeout(() => this.itemsOtherRef.current && this.itemsOtherRef.current.focus({ preventScroll: true }), 30); });
      })) };
    if (step === 7) q = { title: 'Стадия ремонта', hint: 'На каком этапе сейчас ремонт?', hasOpts: true, groupRole: 'radiogroup',
      opts: this.STAGES.map((t, i) => opt(t, s.stage === i, false, () => this.set({ stage: i, stepErr: '' }, () => { if (i === this.OTHER_STAGE) setTimeout(() => this.stageOtherRef.current && this.stageOtherRef.current.focus({ preventScroll: true }), 30); }))) };
    if (step === 8) q = { title: 'Есть ли уже план помещения или дизайн-проект?', hint: 'Выберите один вариант.', hasOpts: true, groupRole: 'radiogroup',
      opts: this.PLANS.map((t, i) => opt(t, s.plan === i, false, () => this.set({ plan: i, stepErr: '' }))) };
    if (step === 9) q = { title: 'Как с вами связаться?', hint: 'Дизайнер позвонит вам, уточнит детали и расскажет, что можно сделать.', hasOpts: false, opts: [], groupRole: 'group' };

    const last = step === this.LAST;
    const first = (s.name.trim().split(/\s+/)[0] || '');
    const sent = s.result === 'sent';
    const configured = window.Api ? window.Api.configured : true;
    return {
      demo: s.ready && !configured, cols: s.w > 1000 ? 'minmax(0,1fr) 340px' : 'minmax(0,1fr)', sidePos: s.w > 1000 ? 'sticky' : 'static',
      showQuiz: !s.result, showDone: !!s.result, showSide: !s.result,
      formRef: this.formRef, titleRef: this.titleRef, nameRef: this.nameRef, phoneRef: this.phoneRef, doneRef: this.doneRef, itemsOtherRef: this.itemsOtherRef, stageOtherRef: this.stageOtherRef,
      step, stepName: this.TITLES[step], bar: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((i) => (i <= step ? 1 : 0)), q, showSkip: step <= this.K, skipKitchen: () => this.set({ kitchen: [-1, -1, -1, -1, -1], skipped: true, stepErr: '' }, () => this.go(this.K + 1)), optCols: step === 6 && s.w > 640 ? 'repeat(2, minmax(0,1fr))' : 'minmax(0,1fr)',
      showItemsOther: step === 6 && s.items.includes(this.OTHER_ITEM), itemsOther: s.itemsOther, onItemsOther: (e) => this.set({ itemsOther: e.target.value }),
      showStageOther: step === 7 && s.stage === this.OTHER_STAGE, stageOther: s.stageOther, onStageOther: (e) => this.set({ stageOther: e.target.value }),
      isFiles: false, isContacts: step === 9,
      dropBd: s.over ? '#1A1714' : '#B5ACA1', dropBg: s.over ? '#fff' : '#F7F4EF',
      dragOn: (e) => { e.preventDefault(); if (!s.over) this.setState({ over: true }); }, dragOff: (e) => { e.preventDefault(); this.setState({ over: false }); },
      onDrop: (e) => { e.preventDefault(); this.setState({ over: false }); if (e.dataTransfer && e.dataTransfer.files) this.addFiles(e.dataTransfer.files); },
      onPick: (e) => { this.addFiles(e.target.files); e.target.value = ''; },
      files: s.files.map((f, i) => ({ name: f.name, size: sizeStr(f.size), url: f._url || false, noUrl: !f._url, kind: /pdf/i.test(f.type + f.name) ? 'PDF' : 'IMG', aria: 'Убрать файл ' + f.name,
        remove: () => this.setState({ files: s.files.filter((_, j) => j !== i), stepErr: '' }) })),
      sendErr: s.sendErr,
      name: s.name, onName: (e) => this.set({ name: e.target.value, errs: Object.assign({}, s.errs, { name: false }) }), eName: !!s.errs.name, nameBd: s.errs.name ? '#A33A28' : '#DCD5CA',
      phone: s.phone, onPhone: (e) => this.onPhone(e), ePhone: !!s.errs.phone, phoneBd: s.errs.phone ? '#A33A28' : '#DCD5CA',
      comment: s.comment, onComment: (e) => this.set({ comment: e.target.value }), site: s.site, onSite: (e) => this.setState({ site: e.target.value }),
      consentStr: String(s.consent), toggleConsent: () => this.setState({ consent: !s.consent, errs: Object.assign({}, s.errs, { consent: false }) }),
      consentBd: s.consent ? '#1A1714' : (s.errs.consent ? '#A33A28' : '#8A8177'), consentBg: s.consent ? '#1A1714' : '#fff', consentChk: s.consent ? 1 : 0,
      consentSh: s.errs.consent ? '0 0 0 4px rgba(163,58,40,.15)' : 'none', eConsent: !!s.errs.consent,
      stepErr: s.stepErr, canBack: step > 1, back: () => this.go(step - 1), sending: s.sending,
      submit: (e) => this.submit(e),
      nextLabel: s.sending ? s.sendLabel : (last ? 'Отправить заявку' : 'Далее'),
      nextBg: last ? '#B98D5E' : '#1A1714', nextFg: last ? '#14120F' : '#FBFAF7',
      doneTitle: sent ? 'Спасибо' + (first ? ', ' + first : '') + '! Заявка отправлена' : 'Заявка с этого устройства уже отправлена',
      doneP1: sent ? 'Дизайнер свяжется с вами по номеру ' : 'Повторно пройти опрос нельзя: дизайнер уже получил ваши ответы и свяжется с вами по указанному номеру.',
      donePhone: sent ? s.phone : '', doneP1b: sent ? ' и уточнит детали проекта.' : '',
      doneP2: sent ? 'Пока ждёте, посмотрите наши работы: может быть, найдёте то, что хочется видеть у себя дома.' : 'Нужно что-то добавить или изменить? Нажмите «Поддержка сайта» внизу страницы или позвоните нам.',
    };
